[package]
name = "cubacadabra-desktop"
version = "0.0.7"
edition = "2024"
publish = false

[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
cubacadabra-about-preview = { path = "../tools/crates/about-preview" }
cubacadabra-client = { path = "../rust/crates/client", default-features = false, features = ["desktop-backends", "studio-ui"] }
egui = "0.35"
egui-wgpu = { version = "0.35", default-features = false }
egui-winit = "0.35"
env_logger = "0.11"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tungstenite = { version = "0.27", features = ["native-tls"] }
ureq = "3"
url = "2"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSObject",
    "NSString",
] }

[build-dependencies]
cubacadabra-builder = { path = "../tools/crates/builder" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package.moxcms]
opt-level = 3
