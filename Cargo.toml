[package]
name = "cubacadabra-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
cubacadabra-app = { path = "../rust/crates/app" }
cubacadabra-client = { path = "../rust/crates/client", default-features = false, features = ["desktop-backends"] }
egui = "0.35"
egui-wgpu = { version = "0.35", default-features = false }
egui-winit = "0.35"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.27", features = ["native-tls"] }
url = "2"
winit = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
